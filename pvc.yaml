apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi   # size for the vault's expected growth
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sync-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi   # ob CLI state: device identity + sync database
