apiVersion: v1
kind: Secret
metadata:
  name: obsidian-mcp
type: Opaque
stringData:
  # Cloudflare Zero Trust dashboard -> Networks -> Tunnels -> tunnel token
  TUNNEL_TOKEN: "<placeholder>"
  # One-time: docker run --rm -it ghcr.io/crosbyh/obsidian-headless-sync-docker:latest get-token
  OBSIDIAN_AUTH_TOKEN: "<placeholder>"
  # Exact remote vault name (case-sensitive); see: ob sync-list-remote
  VAULT_NAME: "<placeholder>"
  # python -c "import secrets; print(secrets.token_hex(32))"
  VAULT_MCP_TOKEN: "<placeholder>"
  # Interactive OAuth login password; unset/empty => server refuses all authorization
  VAULT_OAUTH_PASSWORD: "<placeholder>"
  # Only if the vault has E2E encryption enabled:
  # VAULT_PASSWORD: "<vault encryption password>"
